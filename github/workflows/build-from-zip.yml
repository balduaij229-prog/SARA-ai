name: Build SARA APK from ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract SARA
        run: unzip -q SARA_Cloud_Build_Ready.zip -d sara-src

      - name: Build APK
        run: gradle --no-daemon -p sara-src :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SARA-debug-APK
          path: sara-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
