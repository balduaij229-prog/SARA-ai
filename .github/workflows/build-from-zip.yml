name: Build SARA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - run: unzip -q SARA_Cloud_Build_Ready.zip -d sara-src
      - run: gradle --no-daemon -p sara-src :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SARA-APK
          path: sara-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
